      background-color: #2563eb;

    /* Main App Frame Area */
    main {

    .app-container {

    @keyframes fadeIn {

    iframe {
      width: 100%;
      border: none;
      min-height: 600px;

    footer {

      padding: 15px;
      font-size: 13px;
      color: #6b7280;
      background-color: #ffffff;
      border-top: 1px solid #e5e7eb;
    }
  </style>
</head>

<body>

  <div class="card">

  <script>
    let audioCtx = null;
    
    function sonarClickMetronomo(esAcento) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "square";
      osc.frequency.setValueAtTime(esAcento ? 1000 : 600, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    const canvas = document.getElementById("canvasRitmo");
    const ctx = canvas.getContext("2d");
    
    let enEjecucion = false;
    let bpm = 80;
    let duracionBeatMs = 0;
    let duracionCompasMs = 0;
    
    let animId = null;
    let timerConteo = null;
    
    let puntos = 0;
    let racha = 0;

    let estadoFase = "parado";
    let tiempoInicioBarra = 0;

    let patronActual = [];
    let hitsObjetivo = [];

    function generarPatronAleatorio() {
      const opciones = ["negra", "corcheas", "silencio"];
      patronActual = [];
      hitsObjetivo = [];

      let tiempoAcumuladoBeats = 0;

      while (tiempoAcumuladoBeats < 8) {
        let eleccion = opciones[Math.floor(Math.random() * opciones.length)];
        
        if (eleccion === "negra") {
          patronActual.push({ tipo: "negra", beat: tiempoAcumuladoBeats });
          hitsObjetivo.push(tiempoAcumuladoBeats);
          tiempoAcumuladoBeats += 1;
        } else if (eleccion === "corcheas") {
          patronActual.push({ tipo: "corcheas", beat: tiempoAcumuladoBeats });
          hitsObjetivo.push(tiempoAcumuladoBeats);
          hitsObjetivo.push(tiempoAcumuladoBeats + 0.5);
          tiempoAcumuladoBeats += 1;
        } else if (eleccion === "silencio") {
          patronActual.push({ tipo: "silencio", beat: tiempoAcumuladoBeats });
          tiempoAcumuladoBeats += 1;
        }
      }
    }

    function dibujarEstructura(beatActivo = -1) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let b = 0; b < 8; b++) {
        let posX = 45 + b * 95;
        ctx.font = "bold 20px Arial";
        let numeroTexto = ((b % 4) + 1).toString();
        
        if (b === beatActivo) {
          ctx.fillStyle = "#007BFF";
          ctx.fillText(numeroTexto, posX, 25);
        } else {
          ctx.fillStyle = "#ccc";
          ctx.fillText(numeroTexto, posX, 25);
        }
      }

      ctx.strokeStyle = "#444";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(25, 85);
      ctx.lineTo(825, 85);
      ctx.stroke();

      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(25, 55); ctx.lineTo(25, 115);     // Barra Inicial
      ctx.moveTo(410, 55); ctx.lineTo(410, 115);   // Divisor central (Compás 1 | Compás 2)
      ctx.moveTo(825, 55); ctx.lineTo(825, 115);   // Barra Final
      ctx.stroke();

      patronActual.forEach(elem => {
        let x = 45 + elem.beat * 95;

        if (elem.tipo === "negra") {
          ctx.fillStyle = "black";
          ctx.beginPath();
          ctx.ellipse(x, 85, 9, 7, -0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + 7, 85); ctx.lineTo(x + 7, 45);
          ctx.stroke();
        } else if (elem.tipo === "corcheas") {
          let x1 = x;
          let x2 = x + 45;

          ctx.fillStyle = "black";
          ctx.beginPath();
          ctx.ellipse(x1, 85, 9, 7, -0.2, 0, Math.PI * 2);
          ctx.ellipse(x2, 85, 9, 7, -0.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x1 + 7, 85); ctx.lineTo(x1 + 7, 45);
          ctx.moveTo(x2 + 7, 85); ctx.lineTo(x2 + 7, 45);
          ctx.stroke();

          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(x1 + 6, 45); ctx.lineTo(x2 + 8, 45);
          ctx.stroke();
        } else if (elem.tipo === "silencio") {
          ctx.strokeStyle = "#666";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x - 5, 60);
          ctx.lineTo(x + 5, 75);
          ctx.lineTo(x - 5, 90);
          ctx.lineTo(x + 2, 105);
          ctx.stroke();
        }
      });
    }

    function arrancarConteo() {
      estadoFase = "conteo";
      document.getElementById("btn-tap").disabled = true;
      generarPatronAleatorio();

      let paso = 0;
      const divFeedback = document.getElementById("feedback");

      function pasoConteo() {
        if (!enEjecucion) return;

        if (paso < 4) {
          sonarClickMetronomo(paso === 0);
          divFeedback.style.color = "#007BFF";
          divFeedback.innerText = "Preparado... " + (paso + 1);
          dibujarEstructura(paso);
          paso++;
          timerConteo = setTimeout(pasoConteo, duracionBeatMs);
        } else {
          estadoFase = "ejecucion";
          document.getElementById("btn-tap").disabled = false;
          divFeedback.innerText = "¡TOCA!";
          tiempoInicioBarra = performance.now();
          animId = requestAnimationFrame(animarBarraVerde);
        }
      }

      pasoConteo();
    }

    function animarBarraVerde(timestamp) {
      if (!enEjecucion || estadoFase !== "ejecucion") return;

      let tiempoTranscurrido = timestamp - tiempoInicioBarra;
      let duracionTotalDosCompasesMs = duracionCompasMs * 2;

      if (tiempoTranscurrido >= duracionTotalDosCompasesMs) {
        arrancarConteo();
        return;
      }

      dibujarEstructura(-1);

      let progreso = tiempoTranscurrido / duracionTotalDosCompasesMs;
      let cursorX = 45 + progreso * 760;

      ctx.strokeStyle = "#28a745";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cursorX, 40);
      ctx.lineTo(cursorX, 130);
      ctx.stroke();

      animId = requestAnimationFrame(animarBarraVerde);
    }

    function registrarToque() {
      if (!enEjecucion || estadoFase !== "ejecucion") return;

      let tiempoActual = performance.now() - tiempoInicioBarra;
      let duracionTotalDosCompasesMs = duracionCompasMs * 2;
      let beatActual = (tiempoActual / duracionTotalDosCompasesMs) * 8;

      let diferenciaMinima = Infinity;
      hitsObjetivo.forEach(hitBeat => {
        let diff = Math.abs(beatActual - hitBeat);
        if (diff < diferenciaMinima) diferenciaMinima = diff;
      });

      let msDiferencia = (diferenciaMinima / 8) * duracionTotalDosCompasesMs;

      const divFeedback = document.getElementById("feedback");

      if (msDiferencia < 90) {
        divFeedback.style.color = "green";
        divFeedback.innerText = "¡PERFECTO!";
        puntos += 100;
        racha++;
      } else if (msDiferencia < 180) {
        divFeedback.style.color = "#d97706";
        divFeedback.innerText = "¡BIEN!";
        puntos += 50;
        racha++;
      } else {
        divFeedback.style.color = "red";
        divFeedback.innerText = "¡FUERA DE TIEMPO!";
        racha = 0;
      }

      document.getElementById("puntos").innerText = puntos;
      document.getElementById("racha").innerText = racha;
    }

    function toggleJuego() {
      const btnStart = document.getElementById("btn-start");

      if (!enEjecucion) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        bpm = parseInt(document.getElementById("bpm").value) || 80;
        duracionBeatMs = (60 / bpm) * 1000;
        duracionCompasMs = duracionBeatMs * 4;

        enEjecucion = true;
        btnStart.innerText = "Detener";
        btnStart.style.background = "#dc3545";

        arrancarConteo();
      } else {
        enEjecucion = false;
        estadoFase = "parado";
        clearTimeout(timerConteo);
        cancelAnimationFrame(animId);
        
        btnStart.innerText = "Iniciar";
        btnStart.style.background = "#28a745";
        document.getElementById("btn-tap").disabled = true;
        document.getElementById("feedback").innerText = "";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        dibujarEstructura();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !e.repeat && enEjecucion && estadoFase === "ejecucion") {
        e.preventDefault();
        registrarToque();
      }
    });

    generarPatronAleatorio();
    dibujarEstructura();
  </script>
</body>

<body>

  <h1>Práctica de Lectura Musical</h1>
  <p>Selecciona la clave e identifica la nota que aparece en el pentagrama.</p>

  <!-- Selector de Clave -->
  <div class="selector-clave">
    <button class="btn-clave active" id="btn-sol" onclick="cambiarClave(&apos;sol&apos;)">𝄞 Clave de Sol</button>
    <button class="btn-clave" id="btn-fa" onclick="cambiarClave(&apos;fa&apos;)">𝄢 Clave de Fa</button>
  </div>
  
  <canvas id="pentagrama" width="400" height="260"></canvas>
  <div id="mensaje"></div>
  
  <div>
    <button class="btn" onclick="adivinar(&apos;Do&apos;)">Do</button>
    <button class="btn" onclick="adivinar(&apos;Re&apos;)">Re</button>
    <button class="btn" onclick="adivinar(&apos;Mi&apos;)">Mi</button>
    <button class="btn" onclick="adivinar(&apos;Fa&apos;)">Fa</button>
    <button class="btn" onclick="adivinar(&apos;Sol&apos;)">Sol</button>
    <button class="btn" onclick="adivinar(&apos;La&apos;)">La</button>
    <button class="btn" onclick="adivinar(&apos;Si&apos;)">Si</button>
  </div>

  <h2 id="aciertos-texto">Aciertos consecutivos: <span id="aciertos">0</span></h2>
  
  <button class="btn btn-reiniciar" onclick="reiniciarJuego()">Reiniciar Juego</button>

  <script>
    const canvas = document.getElementById("pentagrama");
    const ctx = canvas.getContext("2d");
    let notaActual = "";
    let aciertos = 0;
    let claveActual = "sol"; // "sol" o "fa"

    // Definición de notas para Clave de Sol
    const notasSol = [
      { nombre: "Do", y: 200, lineasExtras: [200] },
      { nombre: "Re", y: 190, lineasExtras: [] },
      { nombre: "Mi", y: 180, lineasExtras: [] },
      { nombre: "Fa", y: 170, lineasExtras: [] },
      { nombre: "Sol", y: 160, lineasExtras: [] },
      { nombre: "La", y: 150, lineasExtras: [] },
      { nombre: "Si", y: 140, lineasExtras: [] },
      { nombre: "Do", y: 130, lineasExtras: [] },
      { nombre: "Re", y: 120, lineasExtras: [] },
      { nombre: "Mi", y: 110, lineasExtras: [] },
      { nombre: "Fa", y: 100, lineasExtras: [] },
      { nombre: "Sol", y: 90, lineasExtras: [] },
      { nombre: "La", y: 80, lineasExtras: [80] },
      { nombre: "Si", y: 70, lineasExtras: [80] },
      { nombre: "Do", y: 60, lineasExtras: [80, 60] }
    ];

    // Definición de notas para Clave de Fa (Notas más graves)
    const notasFa = [
      { nombre: "Mi", y: 200, lineasExtras: [200] },
      { nombre: "Fa", y: 190, lineasExtras: [] },
      { nombre: "Sol", y: 180, lineasExtras: [] },
      { nombre: "La", y: 170, lineasExtras: [] },
      { nombre: "Si", y: 160, lineasExtras: [] },
      { nombre: "Do", y: 150, lineasExtras: [] },
      { nombre: "Re", y: 140, lineasExtras: [] },
      { nombre: "Mi", y: 130, lineasExtras: [] },
      { nombre: "Fa", y: 120, lineasExtras: [] },
      { nombre: "Sol", y: 110, lineasExtras: [] },
      { nombre: "La", y: 100, lineasExtras: [] },
      { nombre: "Si", y: 90, lineasExtras: [] },
      { nombre: "Do", y: 80, lineasExtras: [80] },
      { nombre: "Re", y: 70, lineasExtras: [80] },
      { nombre: "Mi", y: 60, lineasExtras: [80, 60] }
    ];

    function cambiarClave(clave) {
      claveActual = clave;
      document.getElementById("btn-sol").classList.toggle("active", clave === &apos;sol&apos;);
      document.getElementById("btn-fa").classList.toggle("active", clave === &apos;fa&apos;);
      generarNota();
    }

    function dibujarPentagrama() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 2;

      // Dibujar 5 líneas horizontales del pentagrama
      for(let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(50, 100 + i * 20);
        ctx.lineTo(350, 100 + i * 20);
        ctx.stroke();
      }

      ctx.fillStyle = "black";
      if (claveActual === "sol") {
        ctx.font = "70px Arial";
        ctx.fillText("𝄞", 60, 175);
      } else {
        ctx.font = "60px Arial";
        ctx.fillText("𝄢", 60, 150);
      }
    }

    function generarNota() {
      dibujarPentagrama();
      const conjuntoNotas = claveActual === "sol" ? notasSol : notasFa;
      const indice = Math.floor(Math.random() * conjuntoNotas.length);
      const nota = conjuntoNotas[indice];
      notaActual = nota.nombre;

      // Dibujar cabeza de la nota
      ctx.beginPath();
      ctx.ellipse(200, nota.y, 12, 9, 0, 0, 2 * Math.PI);
      ctx.fillStyle = "black";
      ctx.fill();

      // Dibujar líneas adicionales si la nota está fuera del pentagrama
      if (nota.lineasExtras.length > 0) {
        nota.lineasExtras.forEach(yLinea => {
          ctx.beginPath();
          ctx.moveTo(175, yLinea);
          ctx.lineTo(225, yLinea);
          ctx.stroke();
        });
      }
    }

    function adivinar(intento) {

<body>

  <div class="tuner-container">
    <h1>Afinador Pro</h1>

    <!-- Modo de instrumento -->
    <div class="row">
      <button id="btn-guitar" class="active" onclick="setInstrument(&apos;guitar&apos;)">Guitarra</button>
      <button id="btn-bass" onclick="setInstrument(&apos;bass&apos;)">Bajo</button>
    </div>

    <!-- Selección de Afinación -->
    <div class="row">
      <select id="tuning-select" onchange="changeTuning()">
        <option value="standard">Standard (E A D G B E)</option>
        <option value="drop_d">Drop D (D A D G B E)</option>
        <option value="half_step">Half-Step Down (D# G# C# F# A# D#)</option>

    <div class="note-display" id="note">-</div>
    <div class="freq-display" id="freq">0.0 Hz</div>

    <div class="gauge-container">
      <div class="center-line"></div>
      <div class="needle" id="needle"></div>
    </div>

    <div class="status" id="status">Presiona para afinar</div>

    <button class="start-btn" id="start-btn" onclick="toggleMic()">Iniciar Micrófono</button>

    <!-- Tonos de Referencia -->
    <div class="reference-section">
      <div class="reference-title">Tonos de Referencia (Afinar de oído)</div>
      <div class="string-buttons" id="string-buttons">
        <!-- Los botones de las cuerdas se generan dinámicamente -->
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let analyser = null;
    let isListening = false;
    let currentInstrument = &apos;guitar&apos;;
    let currentTuningKey = &apos;standard&apos;;
    
    // Oscilador para los tonos de referencia
    let activeOscillator = null;
    let activeGainNode = null;
    let playingNoteIndex = null;

    const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    // Frecuencias exactas para Guitarra y Bajo según la afinación
    const TUNINGS = {
      guitar: {
        standard: [
          { name: "E2", freq: 82.41 },
          { name: "A2", freq: 110.00 },
          { name: "D3", freq: 146.83 },
          { name: "G3", freq: 196.00 },
          { name: "B3", freq: 246.94 },
          { name: "E4", freq: 329.63 }
        ],
        drop_d: [
          { name: "D2", freq: 73.42 },
          { name: "A2", freq: 110.00 },
          { name: "D3", freq: 146.83 },
          { name: "G3", freq: 196.00 },
          { name: "B3", freq: 246.94 },
          { name: "E4", freq: 329.63 }
        ],
        half_step: [
          { name: "D#2", freq: 77.78 },
          { name: "G#2", freq: 103.83 },
          { name: "C#3", freq: 138.59 },
          { name: "F#3", freq: 185.00 },
          { name: "A#3", freq: 233.08 },
          { name: "D#4", freq: 311.13 }
        ]
      },
      bass: {
        standard: [
          { name: "E1", freq: 41.20 },
          { name: "A1", freq: 55.00 },
          { name: "D2", freq: 73.42 },
          { name: "G2", freq: 98.00 }
        ],
        drop_d: [
          { name: "D1", freq: 36.71 },
          { name: "A1", freq: 55.00 },
          { name: "D2", freq: 73.42 },
          { name: "G2", freq: 98.00 }
        ],
        half_step: [
          { name: "D#1", freq: 38.89 },
          { name: "G#1", freq: 51.91 },
          { name: "C#2", freq: 69.30 },
          { name: "F#2", freq: 92.50 }
        ]
      }
    };

    async function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === &apos;suspended&apos;) {
        await audioCtx.resume();
      }
    }

    function setInstrument(inst) {
      currentInstrument = inst;
      document.getElementById(&apos;btn-guitar&apos;).classList.toggle(&apos;active&apos;, inst === &apos;guitar&apos;);
      document.getElementById(&apos;btn-bass&apos;).classList.toggle(&apos;active&apos;, inst === &apos;bass&apos;);
      stopReferenceTone();
      renderStringButtons();
    }

    function changeTuning() {
      currentTuningKey = document.getElementById(&apos;tuning-select&apos;).value;
      stopReferenceTone();
      renderStringButtons();
    }

    function renderStringButtons() {
      const container = document.getElementById(&apos;string-buttons&apos;);
      container.innerHTML = &apos;&apos;;
      const strings = TUNINGS[currentInstrument][currentTuningKey];

      strings.forEach((str, index) => {
        const btn = document.createElement(&apos;button&apos;);
        btn.className = &apos;btn-string&apos;;
        btn.innerText = str.name;
        btn.id = `str-btn-${index}`;
        btn.onclick = () => toggleReferenceTone(index, str.freq);
        container.appendChild(btn);
      });
    }

    async function toggleReferenceTone(index, freq) {
      await initAudioContext();

      if (playingNoteIndex === index) {
        stopReferenceTone();
        return;
      }

      // Apagar nota anterior de forma inmediata
      stopReferenceTone();

      playingNoteIndex = index;
      const btn = document.getElementById(`str-btn-${index}`);
      if (btn) btn.classList.add(&apos;playing&apos;);

      // Crear nuevo oscilador y ganancia
      activeGainNode = audioCtx.createGain();
      activeGainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);

      activeOscillator = audioCtx.createOscillator();
      activeOscillator.type = &apos;sine&apos;;
      activeOscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);

      activeOscillator.connect(activeGainNode);
      activeGainNode.connect(audioCtx.destination);

      activeOscillator.start();
    }

    function stopReferenceTone() {
      if (activeOscillator) {
        try {
          activeOscillator.stop();
          activeOscillator.disconnect();
        } catch (e) {}
        activeOscillator = null;
      }

      if (activeGainNode) {
        try {
          activeGainNode.disconnect();
        } catch (e) {}
        activeGainNode = null;
      }

      if (playingNoteIndex !== null) {
        const btn = document.getElementById(`str-btn-${playingNoteIndex}`);
        if (btn) btn.classList.remove(&apos;playing&apos;);
        playingNoteIndex = null;
      }
    }

    async function toggleMic() {
      await initAudioContext();
      stopReferenceTone();

      if (isListening) {
        isListening = false;
        document.getElementById(&apos;start-btn&apos;).innerText = "Iniciar Micrófono";
        document.getElementById(&apos;note&apos;).innerText = "-";
        document.getElementById(&apos;freq&apos;).innerText = "0.0 Hz";
        document.getElementById(&apos;status&apos;).innerText = "Afinador en pausa";
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          } 
        });
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;

        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);

        isListening = true;
        document.getElementById(&apos;start-btn&apos;).innerText = "Detener Micrófono";
        document.getElementById(&apos;status&apos;).innerText = "Escuchando...";
        updatePitch();
      } catch (err) {
        alert("Error al acceder al micrófono. Recuerda que si abres el archivo localmente en un móvil, el navegador puede bloquear el acceso por no ser una conexión HTTPS.");
      }
    }

    function autoCorrelate(buffer, sampleRate) {
      let SIZE = buffer.length;
      let rms = 0;

      for (let i = 0; i < SIZE; i++) {
        let val = buffer[i];
        rms += val * val;
      }
      rms = Math.sqrt(rms / SIZE);

      if (rms < 0.01) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) {
        if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
      }
      for (let i = 1; i < SIZE / 2; i++) {
        if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; }
      }

      buffer = buffer.slice(r1, r2);
      SIZE = buffer.length;

      let c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE - i; j++) {
          c[i] = c[i] + buffer[j] * buffer[j + i];
        }
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }

      let T0 = maxpos;
      return sampleRate / T0;
    }

    function updatePitch() {
      if (!isListening) return;

      const buffer = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buffer);
      const pitch = autoCorrelate(buffer, audioCtx.sampleRate);

      if (pitch !== -1) {
        const minFreq = currentInstrument === &apos;bass&apos; ? 30 : 70;
        const maxFreq = currentInstrument === &apos;bass&apos; ? 400 : 1000;

        if (pitch >= minFreq && pitch <= maxFreq) {
          const noteNum = 12 * (Math.log(pitch / 440) / Math.log(2)) + 57;
          const roundedNote = Math.round(noteNum);
          const noteName = NOTES[roundedNote % 12];
          
          const expectedFreq = 440 * Math.pow(2, (roundedNote - 57) / 12);
          const cents = Math.floor(1200 * Math.log2(pitch / expectedFreq));

          document.getElementById(&apos;note&apos;).innerText = noteName;
          document.getElementById(&apos;freq&apos;).innerText = pitch.toFixed(1) + " Hz";

          const needle = document.getElementById(&apos;needle&apos;);
          const percent = Math.max(0, Math.min(100, 50 + cents));
          needle.style.left = percent + "%";

          const status = document.getElementById(&apos;status&apos;);
          if (Math.abs(cents) <= 3) {
            status.innerText = "¡Afinado!";
            status.style.color = "var(--accent)";
            needle.style.backgroundColor = "var(--accent)";
          } else if (cents < 0) {
            status.innerText = "Muy bajo (Sube tensión)";
            status.style.color = "var(--flat)";
            needle.style.backgroundColor = "var(--flat)";
          } else {
            status.innerText = "Muy alto (Baja tensión)";
            status.style.color = "var(--sharp)";
            needle.style.backgroundColor = "var(--sharp)";
          }
        }
      }

      requestAnimationFrame(updatePitch);
    }

    renderStringButtons();
  </script>
