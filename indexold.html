<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Educación Musical - Menú Principal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #1c1e21;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      padding: 20px 30px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    /* Navigation Bar */
    nav {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 12px 20px;
      border-bottom: 1px solid #e0e0e0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #4b5563;
      background-color: #f3f4f6;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .nav-btn:hover {
      background-color: #e5e7eb;
      color: #1f2937;
    }

    .nav-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
    }

    .nav-btn icon {
      font-size: 18px;
    }

    /* Main App Frame Area */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 25px 15px;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      display: none;
      padding: 20px;
    }

    .app-container.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    iframe {
      width: 100%;
      border: none;
      min-height: 600px;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 13px;
      color: #6b7280;
      background-color: #ffffff;
      border-top: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎼 Academia Digital de Música</h1>
    <p>Selecciona una de las prácticas interactivas del menú para comenzar</p>
  </header>

  <nav>
    <button class="nav-btn active" onclick="mostrarPagina('ritmo', this)">
      🥁 Lectura Rítmica
    </button>
    <button class="nav-btn" onclick="mostrarPagina('notas', this)">
      🎼 Lectura de Notas
    </button>
  </nav>

  <main>
    <!-- Contenedor App 1: Practica de Lectura Ritmica -->
    <div id="ritmo" class="app-container active">
      <iframe srcdoc='<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica de Lectura Rítmica</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      padding: 20px;
      margin: 0;
    }
    
    .card {

    .btn:active { transform: scale(0.98); }

    .btn-tap { background: #007BFF; width: 80%; max-width: 300px; padding: 18px; font-size: 22px; }
    .btn-tap:hover { background: #0056b3; }
    .btn-tap:disabled { background: #ccc; cursor: not-allowed; }
    
    .controles {
      margin: 15px 0;
      display: flex;

    label { font-size: 18px; font-weight: bold; }

  </style>
</head>
<body>

  <div class="card">
    <h1>Entrenador de Lectura Rítmica</h1>
    <p>Escucha el conteo previo y presiona <strong>TOCAR</strong> o la <strong>Barra Espaciadora</strong> al leer el ritmo.</p>

    <div class="controles">
      <label for="bpm">Tempo (BPM):</label>
      <input type="number" id="bpm" value="80" min="40" max="180">
      <button class="btn btn-principal" id="btn-start" onclick="toggleJuego()">Iniciar</button>
    </div>

    <canvas id="canvasRitmo" width="550" height="150"></canvas>

    <div id="feedback"></div>

    <div>
      <button class="btn btn-tap" id="btn-tap" onmousedown="registrarToque()" disabled>TOCAR (Espacio)</button>
    </div>

    <div class="puntuacion">
      Puntos: <strong id="puntos">0</strong> | Aciertos Seguidos: <strong id="racha">0</strong>
    </div>
  </div>

  <script>
    let audioCtx = null;
    
    function sonarClickMetronomo(esAcento) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "square";
      osc.frequency.setValueAtTime(esAcento ? 1000 : 600, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    const canvas = document.getElementById("canvasRitmo");
    const ctx = canvas.getContext("2d");
    
    let enEjecucion = false;
    let bpm = 80;
    let duracionBeatMs = 0;
    let duracionCompasMs = 0;
    
    let animId = null;
    let timerConteo = null;
    
    let puntos = 0;
    let racha = 0;

    let estadoFase = "parado";
    let tiempoInicioBarra = 0;

    let patronActual = [];
    let hitsObjetivo = [];

    function generarPatronAleatorio() {
      const opciones = ["negra", "corcheas", "silencio"];
      patronActual = [];
      hitsObjetivo = [];

      let tiempoAcumuladoBeats = 0;

      while (tiempoAcumuladoBeats < 4) {
        let eleccion = opciones[Math.floor(Math.random() * opciones.length)];
        
        if (eleccion === "negra") {
          patronActual.push({ tipo: "negra", beat: tiempoAcumuladoBeats });
          hitsObjetivo.push(tiempoAcumuladoBeats);
          tiempoAcumuladoBeats += 1;
        } else if (eleccion === "corcheas") {
          patronActual.push({ tipo: "corcheas", beat: tiempoAcumuladoBeats });
          hitsObjetivo.push(tiempoAcumuladoBeats);
          hitsObjetivo.push(tiempoAcumuladoBeats + 0.5);
          tiempoAcumuladoBeats += 1;
        } else if (eleccion === "silencio") {
          patronActual.push({ tipo: "silencio", beat: tiempoAcumuladoBeats });
          tiempoAcumuladoBeats += 1;
        }
      }
    }

    function dibujarEstructura(beatActivo = -1) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let b = 0; b < 4; b++) {
        let posX = 50 + b * 110;
        ctx.font = "bold 22px Arial";
        
        if (b === beatActivo) {
          ctx.fillStyle = "#007BFF";
          ctx.fillText((b + 1).toString(), posX, 25);
        } else {
          ctx.fillStyle = "#ccc";
          ctx.fillText((b + 1).toString(), posX, 25);
        }
      }

      ctx.strokeStyle = "#444";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(30, 85);
      ctx.lineTo(520, 85);
      ctx.stroke();

      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(30, 55); ctx.lineTo(30, 115);
      ctx.moveTo(520, 55); ctx.lineTo(520, 115);
      ctx.stroke();

      patronActual.forEach(elem => {
        let x = 50 + elem.beat * 110;

        if (elem.tipo === "negra") {
          ctx.fillStyle = "black";
          ctx.beginPath();
          ctx.ellipse(x, 85, 9, 7, -0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + 7, 85); ctx.lineTo(x + 7, 45);
          ctx.stroke();
        } else if (elem.tipo === "corcheas") {
          let x1 = x;
          let x2 = x + 55;

          ctx.fillStyle = "black";
          ctx.beginPath();
          ctx.ellipse(x1, 85, 9, 7, -0.2, 0, Math.PI * 2);
          ctx.ellipse(x2, 85, 9, 7, -0.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x1 + 7, 85); ctx.lineTo(x1 + 7, 45);
          ctx.moveTo(x2 + 7, 85); ctx.lineTo(x2 + 7, 45);
          ctx.stroke();

          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(x1 + 6, 45); ctx.lineTo(x2 + 8, 45);
          ctx.stroke();
        } else if (elem.tipo === "silencio") {
          ctx.strokeStyle = "#666";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x - 5, 60);
          ctx.lineTo(x + 5, 75);
          ctx.lineTo(x - 5, 90);
          ctx.lineTo(x + 2, 105);
          ctx.stroke();
        }
      });
    }

    function arrancarConteo() {
      estadoFase = "conteo";
      document.getElementById("btn-tap").disabled = true;
      generarPatronAleatorio();

      let paso = 0;
      const divFeedback = document.getElementById("feedback");

      function pasoConteo() {
        if (!enEjecucion) return;

        if (paso < 4) {
          sonarClickMetronomo(paso === 0);
          divFeedback.style.color = "#007BFF";
          divFeedback.innerText = "Preparado... " + (paso + 1);
          dibujarEstructura(paso);
          paso++;
          timerConteo = setTimeout(pasoConteo, duracionBeatMs);
        } else {
          estadoFase = "ejecucion";
          document.getElementById("btn-tap").disabled = false;
          divFeedback.innerText = "¡TOCA!";
          tiempoInicioBarra = performance.now();
          animId = requestAnimationFrame(animarBarraVerde);
        }
      }

      pasoConteo();
    }

    function animarBarraVerde(timestamp) {
      if (!enEjecucion || estadoFase !== "ejecucion") return;

      let tiempoTranscurrido = timestamp - tiempoInicioBarra;

      if (tiempoTranscurrido >= duracionCompasMs) {
        arrancarConteo();
        return;
      }

      dibujarEstructura(-1);

      let progreso = tiempoTranscurrido / duracionCompasMs;
      let cursorX = 50 + progreso * 440;

      ctx.strokeStyle = "#28a745";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cursorX, 40);
      ctx.lineTo(cursorX, 130);
      ctx.stroke();

      animId = requestAnimationFrame(animarBarraVerde);
    }

    function registrarToque() {
      if (!enEjecucion || estadoFase !== "ejecucion") return;

      let tiempoActual = performance.now() - tiempoInicioBarra;
      let beatActual = (tiempoActual / duracionCompasMs) * 4;

      let diferenciaMinima = Infinity;
      hitsObjetivo.forEach(hitBeat => {
        let diff = Math.abs(beatActual - hitBeat);
        if (diff < diferenciaMinima) diferenciaMinima = diff;
      });

      let msDiferencia = (diferenciaMinima / 4) * duracionCompasMs;

      const divFeedback = document.getElementById("feedback");

      if (msDiferencia < 90) {
        divFeedback.style.color = "green";
        divFeedback.innerText = "¡PERFECTO!";
        puntos += 100;
        racha++;
      } else if (msDiferencia < 180) {
        divFeedback.style.color = "#d97706";
        divFeedback.innerText = "¡BIEN!";
        puntos += 50;
        racha++;
      } else {
        divFeedback.style.color = "red";
        divFeedback.innerText = "¡FUERA DE TIEMPO!";
        racha = 0;
      }

      document.getElementById("puntos").innerText = puntos;
      document.getElementById("racha").innerText = racha;
    }

    function toggleJuego() {
      const btnStart = document.getElementById("btn-start");

      if (!enEjecucion) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        bpm = parseInt(document.getElementById("bpm").value) || 80;
        duracionBeatMs = (60 / bpm) * 1000;
        duracionCompasMs = duracionBeatMs * 4;

        enEjecucion = true;
        btnStart.innerText = "Detener";
        btnStart.style.background = "#dc3545";

        arrancarConteo();
      } else {
        enEjecucion = false;
        estadoFase = "parado";
        clearTimeout(timerConteo);
        cancelAnimationFrame(animId);
        
        btnStart.innerText = "Iniciar";
        btnStart.style.background = "#28a745";
        document.getElementById("btn-tap").disabled = true;
        document.getElementById("feedback").innerText = "";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        dibujarEstructura();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !e.repeat && enEjecucion && estadoFase === "ejecucion") {
        e.preventDefault();
        registrarToque();
      }
    });

    generarPatronAleatorio();
    dibujarEstructura();
  </script>
</body>
</html>'></iframe>
    </div>

      <iframe srcdoc='<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector Musical</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      background-color: #f4f4f9; 
      padding: 20px; 
    }
    canvas { 
      background: white;

      border-radius: 5px; 
      background: #007BFF;

    }
    .btn:hover { background: #0056b3; }
    
    .btn-reiniciar {
      background: #dc3545;
      margin-top: 15px;
    }
    .btn-reiniciar:hover { background: #a71d2a; }

    #mensaje { font-size: 24px; font-weight: bold; height: 30px; margin: 10px; }

  </style>
</head>
<body>

  <h1>Práctica de Lectura Musical</h1>
  <p>Clave de Sol: Identifica la nota que aparece en el pentagrama.</p>
  
  <canvas id="pentagrama" width="400" height="260"></canvas>
  <div id="mensaje"></div>
  
  <div>
    <button class="btn" onclick="adivinar(&apos;Do&apos;)">Do</button>
    <button class="btn" onclick="adivinar(&apos;Re&apos;)">Re</button>
    <button class="btn" onclick="adivinar(&apos;Mi&apos;)">Mi</button>
    <button class="btn" onclick="adivinar(&apos;Fa&apos;)">Fa</button>
    <button class="btn" onclick="adivinar(&apos;Sol&apos;)">Sol</button>
    <button class="btn" onclick="adivinar(&apos;La&apos;)">La</button>
    <button class="btn" onclick="adivinar(&apos;Si&apos;)">Si</button>
  </div>

  <h2 id="aciertos-texto">Aciertos consecutivos: <span id="aciertos">0</span></h2>
  
  <button class="btn btn-reiniciar" onclick="reiniciarJuego()">Reiniciar Juego</button>

  <script>
    const canvas = document.getElementById("pentagrama");
    const ctx = canvas.getContext("2d");
    let notaActual = "";
    let aciertos = 0;

    const notas = [
      { nombre: "Do", y: 200, lineasExtras: [200] },
      { nombre: "Re", y: 190, lineasExtras: [] },
      { nombre: "Mi", y: 180, lineasExtras: [] },
      { nombre: "Fa", y: 170, lineasExtras: [] },
      { nombre: "Sol", y: 160, lineasExtras: [] },
      { nombre: "La", y: 150, lineasExtras: [] },
      { nombre: "Si", y: 140, lineasExtras: [] },
      { nombre: "Do", y: 130, lineasExtras: [] },
      { nombre: "Re", y: 120, lineasExtras: [] },
      { nombre: "Mi", y: 110, lineasExtras: [] },
      { nombre: "Fa", y: 100, lineasExtras: [] },
      { nombre: "Sol", y: 90, lineasExtras: [] },
      { nombre: "La", y: 80, lineasExtras: [80] },
      { nombre: "Si", y: 70, lineasExtras: [80] },
      { nombre: "Do", y: 60, lineasExtras: [80, 60] },
      { nombre: "Re", y: 50, lineasExtras: [80, 60] },
      { nombre: "Mi", y: 40, lineasExtras: [80, 60, 40] }
    ];

    function dibujarPentagrama() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 2;

      for(let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(50, 100 + i * 20);
        ctx.lineTo(350, 100 + i * 20);
        ctx.stroke();
      }

      ctx.font = "70px Arial";
      ctx.fillStyle = "black";
      ctx.fillText("𝄞", 60, 175);
    }

    function generarNota() {
      dibujarPentagrama();
      const indice = Math.floor(Math.random() * notas.length);
      const nota = notas[indice];
      notaActual = nota.nombre;

      ctx.beginPath();
      ctx.ellipse(200, nota.y, 12, 9, 0, 0, 2 * Math.PI);
      ctx.fillStyle = "black";
      ctx.fill();

      if (nota.lineasExtras.length > 0) {
        nota.lineasExtras.forEach(yLinea => {
          ctx.beginPath();
          ctx.moveTo(175, yLinea);
          ctx.lineTo(225, yLinea);
          ctx.stroke();
        });
      }
    }

    function adivinar(intento) {
      const mensaje = document.getElementById("mensaje");
      if(intento === notaActual) {
        mensaje.style.color = "green";
        mensaje.innerText = "¡Correcto!";
        aciertos++;
        document.getElementById("aciertos").innerText = aciertos;
        setTimeout(() => { 
          mensaje.innerText = "";
          generarNota(); 
        }, 800);
      } else {
        mensaje.style.color = "red";
        mensaje.innerText = "Incorrecto. Era " + notaActual;
        aciertos = 0;
        document.getElementById("aciertos").innerText = aciertos;
        setTimeout(() => { 
          mensaje.innerText = "";
          generarNota(); 
        }, 1500);
      }
    }

    function reiniciarJuego() {
      aciertos = 0;
      document.getElementById("aciertos").innerText = aciertos;
      document.getElementById("mensaje").innerText = "";
      generarNota();
    }

    generarNota();
  </script>
</body>
</html>'></iframe>

  <script>
    function mostrarPagina(id, btnElement) {
      // Ocultar todos los contenedores
      const contenedores = document.querySelectorAll('.app-container');
      contenedores.forEach(c => c.classList.remove('active'));

      // Desactivar botones
      const botones = document.querySelectorAll('.nav-btn');
      botones.forEach(b => b.classList.remove('active'));

      // Mostrar el seleccionado y activar boton
      document.getElementById(id).classList.add('active');
      btnElement.classList.add('active');
    }
  </script>

</body>
